name: Compilar APK e publicar na Release
on:
  push:
    branches: [main, master]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build-release-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: internet-xp-v1.0.6
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Instalar e verificar SDK Android 37.0
        shell: bash
        run: |
          set -euo pipefail
          # Android 17 usa identificador com sufixo .0 (nao 'android-37').
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" || ! -f "$sdk_root/platforms/android-37.0/android.jar" ]]; then
            echo '::error::Android SDK 37.0 nao foi instalado corretamente.'
            exit 1
          fi
          # Algumas versoes do Gradle procuram 'android-37' mesmo com SDK 37.0.
          # Cria apenas um alias de diretorio para o mesmo SDK, sem falsificar arquivos.
          if [[ ! -e "$sdk_root/platforms/android-37" ]]; then
            ln -s android-37.0 "$sdk_root/platforms/android-37"
          fi
          test -f "$sdk_root/platforms/android-37/android.jar"
          test -f "$sdk_root/build-tools/36.0.0/aapt2"
          echo 'SDK Android 37.0 validado:'
          ls -ld "$sdk_root/platforms/android-37" "$sdk_root/platforms/android-37.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Preparar assinatura opcional
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for key in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -n "$key" ]]; then count=$((count+1)); fi
          done
          if [[ "$count" -gt 0 && "$count" -lt 4 ]]; then
            echo '::error::Assinatura parcialmente configurada: informe os quatro Secrets ou nenhum.'
            exit 1
          fi
          if [[ "$count" -eq 4 ]]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/assinatura.p12"
            chmod 600 "$RUNNER_TEMP/assinatura.p12"
            echo 'mode=release' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=debug' >> "$GITHUB_OUTPUT"
            echo '::warning::Sem Secrets: APK Debug não garante atualização futura com assinatura Release.'
          fi
      - name: Testes, lint e compilação Android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Exibir relatório completo do Lint em caso de falha
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          report="$(find app/build -type f -name 'lint-results-debug.txt' -print -quit 2>/dev/null || true)"
          if [[ -n "$report" && -f "$report" ]]; then
            echo '======== RELATORIO ANDROID LINT COMPLETO ========'
            cat "$report"
          else
            echo 'Relatório Lint em texto não disponível. O Gradle pode ter falhado antes do Lint.'
          fi
      - name: Compilar Release assinado
        if: steps.signing.outputs.mode == 'release'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/assinatura.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Preparar APK sem Artifact ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ steps.signing.outputs.mode }}' == 'release' ]]; then src=app/build/outputs/apk/release/app-release.apk
          else src=app/build/outputs/apk/debug/app-debug.apk; fi
          test -s "$src"
          cp "$src" 'Internet XP.v1.0.6.apk'
          # Bloqueia publicacao de APK com versao ou minSdk inesperados.
          apk_file='Internet XP.v1.0.6.apk'
          aapt_bin="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/36.0.0/aapt"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging "$apk_file" | tee "$RUNNER_TEMP/internetxp-badging.txt"
          grep -Fq "sdkVersion:'26'" "$RUNNER_TEMP/internetxp-badging.txt"
          grep -Fq "versionCode='7' versionName='1.0.6'" "$RUNNER_TEMP/internetxp-badging.txt"
          sha256sum "$apk_file" > "$apk_file.sha256"
      - name: Publicar APK diretamente na Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.6 >/dev/null 2>&1; then
            gh release upload v1.0.6 'Internet XP.v1.0.6.apk' 'Internet XP.v1.0.6.apk.sha256' --clobber
          else
            gh release create v1.0.6 'Internet XP.v1.0.6.apk' 'Internet XP.v1.0.6.apk.sha256' --target "$GITHUB_SHA" --title 'Internet XP v1.0.6' --notes 'Internet XP 1.0.6: corrige dois erros WrongConstant no LinearLayout (orientação vertical explícita) identificados no workflow 6. APK depende da verificação do build.'
          fi
          gh release view v1.0.6 --json url,assets
      - name: Destruir chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/assinatura.p12"
