name: Compilar APK e publicar na Release
on:
  push:
    branches: [main, master]
    paths: ['app/**', 'tools/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build-release-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: internet-xp-v1.0.10
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Instalar e verificar SDK Android 37.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" || ! -f "$sdk_root/platforms/android-37.0/android.jar" ]]; then
            echo '::error::Android SDK 37.0 nao foi instalado corretamente.'
            exit 1
          fi
          if [[ ! -e "$sdk_root/platforms/android-37" ]]; then
            ln -s android-37.0 "$sdk_root/platforms/android-37"
          fi
          test -f "$sdk_root/platforms/android-37/android.jar"
          test -f "$sdk_root/build-tools/36.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Testar validador de tamanho e arquitetura
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Testes, lint e compilação Debug (não publicada)
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug
      - name: Exibir relatório completo do Lint em caso de falha
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          report="$(find app/build -type f -name 'lint-results-debug.txt' -print -quit 2>/dev/null || true)"
          if [[ -n "$report" && -f "$report" ]]; then
            cat "$report"
          else
            echo 'Relatório Lint indisponível; veja o erro Gradle acima.'
          fi
      - name: Preparar assinatura obrigatória para Release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(KEYSTORE_BASE64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Secrets de assinatura AUSENTES no repositório que executou este workflow: ${missing[*]}"
            echo '::error::No GitHub Manager, abra o repositório InternetXP > Secrets > Importar e selecione o TXT privado de assinatura já gerado.'
            echo '::error::Secrets de Environment só funcionam se o job declarar o environment correspondente. Configure como Repository secrets.'
            echo '::error::Nenhum APK Debug será publicado: configure os Secrets antes de executar novamente.'
            exit 1
          fi
          printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/assinatura.p12"
          chmod 600 "$RUNNER_TEMP/assinatura.p12"
          test -s "$RUNNER_TEMP/assinatura.p12"
      - name: Compilar Release otimizada por ABI
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/assinatura.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Validar arquitetura, medir tamanho e preparar Release
        shell: bash
        run: |
          set -euo pipefail
          src_dir='app/build/outputs/apk/release'
          aapt_bin="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/36.0.0/aapt"
          test -x "$aapt_bin"
          : > "$RUNNER_TEMP/release-assets.txt"
          shopt -s nullglob
          all_apks=("$src_dir"/*.apk)
          if [[ ${#all_apks[@]} -ne 4 ]]; then
            echo "::error::Esperados 4 APKs por ABI; encontrados ${#all_apks[@]} em $src_dir"
            exit 1
          fi
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            # Nome padrão documentado pelo Android Gradle Plugin: app-ABI-release.apk.
            # Evita falso positivo: buscar *x86* também encontra x86_64.
            src="$src_dir/app-${abi}-release.apk"
            if [[ ! -s "$src" ]]; then
              echo "::error::APK da arquitetura $abi não encontrado: $src"
              printf 'APKs existentes: %s\n' "${all_apks[@]}"
              exit 1
            fi
            out="Internet XP.v1.0.10-${abi}.apk"
            cp "$src" "$out"
            "$aapt_bin" dump badging "$out" > "$RUNNER_TEMP/${abi}-badging.txt"
            grep -Fq "sdkVersion:'26'" "$RUNNER_TEMP/${abi}-badging.txt"
            grep -Fq "versionCode='11' versionName='1.0.10'" "$RUNNER_TEMP/${abi}-badging.txt"
            python3 tools/report_apk.py "$out" "$abi"
            sha256sum "$out" > "$out.sha256"
            printf '%s\n' "$out" "$out.sha256" >> "$RUNNER_TEMP/release-assets.txt"
          done
          echo 'Arquivos preparados:'
          cat "$RUNNER_TEMP/release-assets.txt"
      - name: Publicar APKs diretamente na Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          if gh release view v1.0.10 >/dev/null 2>&1; then
            gh release upload v1.0.10 "${assets[@]}" --clobber
          else
            gh release create v1.0.10 "${assets[@]}" --target "$GITHUB_SHA" --title 'Internet XP v1.0.10' --notes 'Interface mobile sem barra de título, Android GeckoView. Quatro APKs Release assinados e otimizados com R8, recursos reduzidos e .so comprimidas. Use o APK da ABI do seu aparelho; teste a instalação e o desempenho. Sem Artifact ZIP.'
          fi
          gh release view v1.0.10 --json url,assets
      - name: Destruir chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/assinatura.p12"
