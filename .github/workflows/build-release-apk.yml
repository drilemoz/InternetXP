name: Compilar APK e publicar na Release
on:
  push:
    branches: [main, master]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build-release-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: internet-xp-v1.0.8
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Instalar e verificar SDK Android 37.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" || ! -f "$sdk_root/platforms/android-37.0/android.jar" ]]; then
            echo '::error::Android SDK 37.0 nao foi instalado corretamente.'
            exit 1
          fi
          if [[ ! -e "$sdk_root/platforms/android-37" ]]; then
            ln -s android-37.0 "$sdk_root/platforms/android-37"
          fi
          test -f "$sdk_root/platforms/android-37/android.jar"
          test -f "$sdk_root/build-tools/36.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Preparar assinatura opcional
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for key in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -n "$key" ]]; then count=$((count+1)); fi
          done
          if [[ "$count" -gt 0 && "$count" -lt 4 ]]; then
            echo '::error::Assinatura parcialmente configurada: informe os quatro Secrets ou nenhum.'
            exit 1
          fi
          if [[ "$count" -eq 4 ]]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/assinatura.p12"
            chmod 600 "$RUNNER_TEMP/assinatura.p12"
            echo 'mode=release' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=debug' >> "$GITHUB_OUTPUT"
            echo '::warning::Sem Secrets: serão publicados APKs Debug por ABI, sem garantia de atualização futura.'
          fi
      - name: Testes, lint e compilação Debug por ABI
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Exibir relatório completo do Lint em caso de falha
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          report="$(find app/build -type f -name 'lint-results-debug.txt' -print -quit 2>/dev/null || true)"
          if [[ -n "$report" && -f "$report" ]]; then
            echo '======== RELATORIO ANDROID LINT COMPLETO ========'
            cat "$report"
          else
            echo 'Relatório Lint em texto não disponível. O Gradle pode ter falhado antes do Lint.'
          fi
      - name: Compilar Release assinado por ABI
        if: steps.signing.outputs.mode == 'release'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/assinatura.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Preparar APKs por arquitetura sem Artifact ZIP
        shell: bash
        run: |
          set -euo pipefail
          mode='${{ steps.signing.outputs.mode }}'
          if [[ "$mode" == 'release' ]]; then
            src_dir='app/build/outputs/apk/release'
            suffix='release'
            debug_suffix=''
          else
            src_dir='app/build/outputs/apk/debug'
            suffix='debug'
            debug_suffix='-debug'
          fi
          shopt -s nullglob
          files=("$src_dir"/*.apk)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::Nenhum APK gerado em $src_dir"
            exit 1
          fi
          aapt_bin="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/36.0.0/aapt"
          test -x "$aapt_bin"
          : > "$RUNNER_TEMP/release-assets.txt"
          for src in "${files[@]}"; do
            base="$(basename "$src")"
            abi='unknown'
            case "$base" in
              *armeabi-v7a*) abi='armeabi-v7a' ;;
              *arm64-v8a*) abi='arm64-v8a' ;;
              *x86_64*) abi='x86_64' ;;
              *x86*) abi='x86' ;;
            esac
            out="Internet XP.v1.0.8-${abi}${debug_suffix}.apk"
            cp "$src" "$out"
            "$aapt_bin" dump badging "$out" | tee "$RUNNER_TEMP/${abi}-${suffix}-badging.txt"
            grep -Fq "sdkVersion:'26'" "$RUNNER_TEMP/${abi}-${suffix}-badging.txt"
            grep -Fq "versionCode='9' versionName='1.0.8'" "$RUNNER_TEMP/${abi}-${suffix}-badging.txt"
            sha256sum "$out" > "$out.sha256"
            printf '%s\n' "$out" "$out.sha256" >> "$RUNNER_TEMP/release-assets.txt"
          done
          echo 'Arquivos preparados:'
          cat "$RUNNER_TEMP/release-assets.txt"
      - name: Publicar APKs diretamente na Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          if gh release view v1.0.8 >/dev/null 2>&1; then
            gh release upload v1.0.8 "${assets[@]}" --clobber
          else
            gh release create v1.0.8 "${assets[@]}" --target "$GITHUB_SHA" --title 'Internet XP v1.0.8' --notes 'Internet XP 1.0.8: novo layout mobile XP baseado no mockup do usuário e publicação de APKs separados por arquitetura (armeabi-v7a, arm64-v8a, x86 e x86_64), sem Artifact ZIP.'
          fi
          gh release view v1.0.8 --json url,assets
      - name: Destruir chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/assinatura.p12"
