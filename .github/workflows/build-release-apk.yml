name: Compilar APK e publicar na Release
on:
  push:
    branches: [main, master]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build-release-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: internet-xp-v1.0.0
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preparar assinatura opcional
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/assinatura.p12"
            chmod 600 "$RUNNER_TEMP/assinatura.p12"
            echo 'mode=release' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=debug' >> "$GITHUB_OUTPUT"
            echo '::warning::Sem Secrets: APK Debug não garante atualização futura com assinatura Release.'
          fi
      - name: Testes, lint e compilação Android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Compilar Release assinado
        if: steps.signing.outputs.mode == 'release'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/assinatura.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Preparar APK sem Artifact ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ steps.signing.outputs.mode }}' == 'release' ]]; then src=app/build/outputs/apk/release/app-release.apk
          else src=app/build/outputs/apk/debug/app-debug.apk; fi
          test -s "$src"
          cp "$src" 'Internet XP.v1.0.0.apk'
          sha256sum 'Internet XP.v1.0.0.apk' > 'Internet XP.v1.0.0.apk.sha256'
      - name: Publicar APK diretamente na Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 'Internet XP.v1.0.0.apk' 'Internet XP.v1.0.0.apk.sha256' --clobber
          else
            gh release create v1.0.0 'Internet XP.v1.0.0.apk' 'Internet XP.v1.0.0.apk.sha256' --target "$GITHUB_SHA" --title 'Internet XP v1.0.0' --notes 'Primeira versão: GeckoView e interface XP. Verificar assinatura antes de atualizar versões.'
          fi
          gh release view v1.0.0 --json url,assets
      - name: Destruir chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/assinatura.p12"
