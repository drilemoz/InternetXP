plugins { id 'com.android.application' }
android {
 namespace 'br.com.internetxp'
 compileSdk 37
 defaultConfig {
  applicationId 'br.com.internetxp'
  minSdk 26
  targetSdk 35
  versionCode 12
  versionName '1.0.11'
 }

 splits {
  abi {
   enable true
   reset()
   include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
   universalApk false
  }
 }

 // Para distribuição fora da Play: compacta bibliotecas .so dentro do APK.
 // Reduz o download, mas ocupa mais armazenamento após extração na instalação.
 packaging {
  jniLibs { useLegacyPackaging = true }
 }

 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 def store = System.getenv('ANDROID_KEYSTORE_FILE')
 def pass = System.getenv('KEYSTORE_PASSWORD')
 def alias = System.getenv('KEY_ALIAS')
 def keypass = System.getenv('KEY_PASSWORD')
 def signed = store && pass && alias && keypass
 signingConfigs { release {
  if (signed) {
   storeFile file(store)
   storePassword pass
   keyAlias alias
   keyPassword keypass
  }
 } }
 buildTypes {
  debug { }
  release {
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
   if (signed) signingConfig signingConfigs.release
  }
 }
 lint { abortOnError true }
}
dependencies {
 implementation 'org.mozilla.geckoview:geckoview:158.0.20261007201254'
 testImplementation 'junit:junit:4.13.2'
}
