plugins { id 'com.android.application' }
android {
 namespace 'br.com.internetxp'
 compileSdk 35
 defaultConfig {
  applicationId 'br.com.internetxp'
  minSdk 24
  targetSdk 35
  versionCode 1
  versionName '1.0.0'
  ndk { abiFilters 'arm64-v8a' }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 def store = System.getenv('ANDROID_KEYSTORE_FILE')
 def pass = System.getenv('KEYSTORE_PASSWORD')
 def alias = System.getenv('KEY_ALIAS')
 def keypass = System.getenv('KEY_PASSWORD')
 def signed = store && pass && alias && keypass
 signingConfigs { release {
  if (signed) {
   storeFile file(store)
   storePassword pass
   keyAlias alias
   keyPassword keypass
  }
 } }
 buildTypes {
  debug { }
  release { minifyEnabled false; if (signed) signingConfig signingConfigs.release }
 }
 lint { abortOnError true }
}
dependencies {
 implementation 'org.mozilla.geckoview:geckoview:158.0.20261007201254'
 testImplementation 'junit:junit:4.13.2'
}
